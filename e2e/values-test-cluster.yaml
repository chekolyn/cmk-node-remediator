# E2E Test Values for cmk-test-cluster
#
# Usage:
#   helm install cmk-node-remediation ../helm/cmk-node-remediation \
#     --namespace cmk-node-remediation \
#     --create-namespace \
#     -f e2e/values-test-cluster.yaml \
#     --dry-run  # preview first

# Test cluster: cmk-test-cluster
# Project ID: your-project-id
# Cluster ID: your-cluster-id
# Nodepool: your-nodepool-id
# VM type: c1a.2x (NOT b200 — test cluster has CPU nodes)

image:
  repository: registry.your-location.ccr.crusoecloudcompute.com/crusoe-node-remediation.your-project-id
  tag: v0.0.1
  pullPolicy: IfNotPresent

schedule: "*/5 * * * *"  # every 5 minutes for testing (change to "0 0 * * *" for prod)

# Target all nodes in the test project
nodeSelector:
  matchLabels:
    crusoe.ai/project.id: "your-project-id"

# Test cluster has c1a.2x nodes, not B200
vmInstanceTypeFilter: "c1a.*"

# Lower thresholds for testing (nodes are only 2-3 days old)
cordonThreshold: 30m
actionThreshold: 1h
cooldown: 15m

action:
  type: noop  # start with noop — no real VM actions
  timeout: 5m
  maxRetries: 2

guardrails:
  globalMaxCordoned: 2
  perPoolMaxCordoned: 1

drainTimeout: 2m
forceDrainAfterTimeout: true

crusoeApiSecret: crusoe-api-credentials
crusoeProjectId: "your-project-id"

dryRun: true  # start with dry-run — no changes to nodes

activeDeadlineSeconds: 600  # 10 min max per run
failedJobsHistoryLimit: 5
successfulJobsHistoryLimit: 3
