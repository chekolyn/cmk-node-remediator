# E2E Test Values — Dry Run Mode
#
# Copy this file to e2e/local-values.yaml and fill in your cluster details.
# Then run: bash e2e/run-e2e.sh deploy
#
# This is the SAME format as the production values.yaml — just with
# test-specific thresholds (minutes instead of days).

image:
  repository: ""  # Set in local-values.yaml: your-registry/cmk-node-remediation.your-project-id
  tag: v0.0.1
  pullPolicy: IfNotPresent

# Every 5 minutes for fast testing
schedule: "*/5 * * * *"

# Target nodes in your project — set in local-values.yaml
nodeSelector:
  matchLabels:
    # crusoe.ai/project.id: "your-project-id"

# Test cluster has CPU nodes, not B200
vmInstanceTypeFilter: "c1a.*"

# Fast thresholds for testing (minutes, not days)
cordonThreshold: 30m
actionThreshold: 1h
cooldown: 15m

# Start with noop — no real VM actions
action:
  type: noop
  timeout: 5m
  maxRetries: 2

# Conservative guardrails for testing
guardrails:
  globalMaxCordoned: 2
  perPoolMaxCordoned: 1

drainTimeout: 2m
forceDrainAfterTimeout: true

crusoeApiSecret: crusoe-api-credentials
crusoeProjectId: ""  # Set in local-values.yaml

# Start with dry-run — no changes to nodes
dryRun: true

activeDeadlineSeconds: 600
failedJobsHistoryLimit: 5
successfulJobsHistoryLimit: 3
