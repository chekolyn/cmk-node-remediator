# E2E Test Values — Phase 3: Real VM reset
#
# Same as dry-run-off but with vm-reset action.
# This will actually call Crusoe API to reset VMs.
# Only use after Phase 2 (noop) is verified.
#
# Usage:
#   helm upgrade cmk-node-remediation ../helm/cmk-node-remediation \
#     --namespace cmk-node-remediation \
#     -f e2e/values-test-cluster-vm-reset.yaml

image:
  repository: registry.your-location.ccr.crusoecloudcompute.com/crusoe-node-remediation.your-project-id
  tag: v0.0.1
  pullPolicy: IfNotPresent

schedule: "*/10 * * * *"  # every 10 minutes

nodeSelector:
  matchLabels:
    crusoe.ai/project.id: "your-project-id"

vmInstanceTypeFilter: "c1a.*"

cordonThreshold: 30m
actionThreshold: 1h
cooldown: 15m

action:
  type: vm-reset  # real Crusoe API VM reset
  timeout: 10m
  maxRetries: 2

guardrails:
  globalMaxCordoned: 1  # only 1 at a time for safety
  perPoolMaxCordoned: 1

drainTimeout: 2m
forceDrainAfterTimeout: true

crusoeApiSecret: crusoe-api-credentials
crusoeProjectId: "your-project-id"

dryRun: false

activeDeadlineSeconds: 1800  # 30 min max per run
failedJobsHistoryLimit: 5
successfulJobsHistoryLimit: 3
