# E2E Test Values — Phase 2: Dry-run with cordon
#
# Same as values-test-cluster.yaml but with dryRun=false and noop action.
# This will actually cordon/drain/uncordon nodes but won't call Crusoe API.
#
# Usage:
#   helm upgrade cmk-node-remediation ../helm/cmk-node-remediation \
#     --namespace cmk-node-remediation \
#     -f e2e/values-test-cluster-dry-run-off.yaml

image:
  repository: registry.your-location.ccr.crusoecloudcompute.com/crusoe-node-remediation.your-project-id
  tag: v0.0.1
  pullPolicy: IfNotPresent

schedule: "*/5 * * * *"

nodeSelector:
  matchLabels:
    crusoe.ai/project.id: "your-project-id"

vmInstanceTypeFilter: "c1a.*"

cordonThreshold: 30m
actionThreshold: 1h
cooldown: 15m

action:
  type: noop  # noop — cordon/drain/uncordon but no VM action
  timeout: 5m
  maxRetries: 2

guardrails:
  globalMaxCordoned: 2
  perPoolMaxCordoned: 1

drainTimeout: 2m
forceDrainAfterTimeout: true

crusoeApiSecret: crusoe-api-credentials
crusoeProjectId: "your-project-id"

dryRun: false  # actually cordon/drain/uncordon

activeDeadlineSeconds: 600
failedJobsHistoryLimit: 5
successfulJobsHistoryLimit: 3
