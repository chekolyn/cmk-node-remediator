apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "node-remediation.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-remediation.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.schedule }}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        spec:
          serviceAccountName: {{ include "node-remediation.fullname" . }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
          containers:
            - name: node-remediation
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: CONFIG_PATH
                  value: /etc/node-remediation/config.yaml
                - name: CRUSOE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.crusoeApiSecret }}
                      key: api-key
                - name: CRUSOE_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.crusoeApiSecret }}
                      key: api-url
              volumeMounts:
                - name: config
                  mountPath: /etc/node-remediation
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                  readOnly: false
          volumes:
            - name: config
              configMap:
                name: {{ include "node-remediation.fullname" . }}
            - name: tmp
              emptyDir: {}
