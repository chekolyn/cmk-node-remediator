apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cmk-node-remediation.fullname" . }}
  labels:
    {{- include "cmk-node-remediation.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cmk-node-remediation.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cmk-node-remediation.fullname" . }}
    namespace: {{ .Release.Namespace }}
